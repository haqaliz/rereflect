[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
asyncio_mode = auto
markers =
    needs_real_sentence_transformers: test exercises the real sentence-transformers library (skipped when the package is absent, e.g. in the torch-free CI job)
