name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rereflect
          POSTGRES_PASSWORD: rereflect
          POSTGRES_DB: rereflect_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rereflect:rereflect@localhost:5432/rereflect_test
      REDIS_URL: redis://localhost:6379/0
      SELF_HOSTED: 'true'
      # Deterministic dummy secrets — the suite never talks to a real provider.
      JWT_SECRET: ci-jwt-secret-not-used-outside-ci
      LLM_ENCRYPTION_KEY: 8ZBhLB0mS7lnKZKGSjZ0nGRxKCXQOxJvYcvHkKZ3fLY=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/backend-api/requirements.txt

      # python3-saml pulls in lxml and xmlsec, which build from source and need
      # libxml2/libxslt/xmlsec headers. The ubuntu-latest image does not ship them.
      - name: Install system build dependencies (lxml / xmlsec for SAML SSO)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxslt1-dev libxmlsec1-dev libxmlsec1-openssl pkg-config

      # torch / transformers / sentence-transformers are opt-in ML extras (~2 GB)
      # that only load when an org enables a local model. The suite covers their
      # call sites with stubs, so installing them here would cost minutes per run
      # for no extra coverage. Keep this list in sync with requirements.txt.
      - name: Install dependencies (without the heavy opt-in ML extras)
        working-directory: services/backend-api
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(torch|transformers|sentence-transformers)==' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Apply migrations to a clean database
        working-directory: services/backend-api
        run: alembic upgrade head

      - name: Assert a single Alembic head
        working-directory: services/backend-api
        run: |
          heads="$(alembic heads | grep -c '(head)')"
          echo "alembic heads: $heads"
          if [ "$heads" -ne 1 ]; then
            echo "::error::Expected exactly 1 Alembic head, found $heads. Merge the branches."
            alembic heads
            exit 1
          fi

      - name: pytest
        working-directory: services/backend-api
        run: pytest tests/ -q --timeout=300

  worker:
    name: Worker (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      REDIS_URL: redis://localhost:6379/0
      SELF_HOSTED: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/worker-service/requirements.txt

      - name: Install dependencies
        working-directory: services/worker-service
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(torch|transformers|sentence-transformers)==' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: pytest
        working-directory: services/worker-service
        run: pytest tests/ -q

  frontend:
    name: Frontend (vitest + eslint)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # pnpm workspace — install from the repo root, not the service directory.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        working-directory: services/frontend-web
        run: pnpm run lint

      - name: Vitest
        working-directory: services/frontend-web
        run: pnpm run test
